# collector-go — ConfigMap (env không nhạy cảm), Secret (chỉ mật khẩu),
# Deployment, Service. Khớp compose: HTTP :8080 /healthz + /readyz,
# TCP :9000 nhận log từng dòng, Redis list events:queue.
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-go
  namespace: container-platform
  labels:
    app: collector-go
    app.kubernetes.io/part-of: container-platform
data:
  HTTP_ADDR: ":8080"
  TCP_ADDR: ":9000"
  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  REDIS_QUEUE: "events:queue"
  WORKER_COUNT: "8"
  QUEUE_BUFFER: "1000"
  PUSH_TIMEOUT_MS: "2000"
---
# Secret CHỈ chứa placeholder. Redis trong compose mặc định không đặt mật
# khẩu (REDIS_PASSWORD rỗng) nên giá trị rỗng ở đây là đúng với mặc định
# đó — nếu Redis thật có mật khẩu, thay bằng secret thật TRƯỚC khi dùng
# thật (kubectl create secret generic collector-go
# --from-literal=REDIS_PASSWORD='<mat-khau-that>' rồi apply lại, hoặc
# sealed-secrets / external-secrets). Tuyệt đối không commit secret thật.
apiVersion: v1
kind: Secret
metadata:
  name: collector-go
  namespace: container-platform
  labels:
    app: collector-go
    app.kubernetes.io/part-of: container-platform
type: Opaque
stringData:
  REDIS_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-go
  namespace: container-platform
  labels:
    app: collector-go
    app.kubernetes.io/part-of: container-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector-go
  template:
    metadata:
      labels:
        app: collector-go
        app.kubernetes.io/part-of: container-platform
    spec:
      serviceAccountName: collector-go
      automountServiceAccountToken: false
      securityContext:
        # Image cuối là gcr.io/distroless/static-debian12:nonroot,
        # user nonroot có uid 65532 (chuẩn của distroless).
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector-go
          image: container-platform/collector-go:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: tcp
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: collector-go
            - secretRef:
                name: collector-go
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Collector chỉ ghi log ra stdout, không ghi file nào nên
            # không cần emptyDir: readOnlyRootFilesystem bật được luôn.
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          # TCP :9000 là cổng nhận log, KHÔNG phải health endpoint nên
          # không có probe nào trỏ vào 9000; probe HTTP dùng /healthz.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: collector-go
  namespace: container-platform
  labels:
    app: collector-go
    app.kubernetes.io/part-of: container-platform
spec:
  type: ClusterIP
  selector:
    app: collector-go
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: tcp
      port: 9000
      targetPort: tcp
