; admin-php — php-fpm pool. clear_env = no de bien moi truong cua container
; (POSTGRES_*, ADMIN_*, ...) toi duoc PHP. Listen TCP loopback 127.0.0.1:9000
; thay vi unix socket de khoi phai quan ly quyen file socket.
[admin]
user = admin
group = admin
listen = 127.0.0.1:9000
listen.owner = admin
listen.group = admin
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
php_admin_value[session.save_path] = /tmp/php-sessions
php_admin_value[expose_php] = Off
