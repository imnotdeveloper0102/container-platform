; admin-php — cau hinh PHP. Log loi ra stderr (docker logs thay duoc).
; Cookie session: HttpOnly + SameSite=Lax; Secure bat qua env
; ADMIN_SESSION_SECURE=1 trong Auth::startSession() (mac dinh 0 de chay
; duoc qua http local; bat 1 khi dung sau HTTPS).
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.save_path = "/tmp/php-sessions"
session.gc_maxlifetime = 3600
